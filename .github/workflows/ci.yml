name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Vet
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build server
        run: go build -o /tmp/orbit ./cmd/server

      - name: Build bench
        run: go build -o /tmp/bench ./cmd/bench

      - name: Unit tests
        run: go test -race ./...
        env:
          # Enables the presence tracker's Lua-script tests (DB 15 of the service Redis).
          ORBIT_TEST_REDIS_URL: redis://localhost:6379/15

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Start Orbit servers (two nodes, one Redis)
        run: |
          go build -o /tmp/orbit ./cmd/server
          PORT=8080 /tmp/orbit &
          PORT=8081 /tmp/orbit &
          for port in 8080 8081; do
            for i in $(seq 1 20); do
              if curl -sf http://localhost:$port/metrics > /dev/null 2>&1; then
                echo "Server on :$port ready"; break
              fi
              echo "Waiting for server on :$port... ($i)"; sleep 1
            done
          done
        env:
          REDIS_URL: redis://localhost:6379
          ORBIT_JWT_SECRET: orbit-ci-test-secret-do-not-use-in-production
          ORBIT_SERVER_SECRET: orbit-ci-server-secret-do-not-use-in-production
          # Short leave grace keeps the presence tests fast.
          ORBIT_PRESENCE_LEAVE_GRACE_MS: 500

      - name: Run integration test (raw WebSocket)
        run: node tests/ws-pubsub.test.js
        env:
          ORBIT_JWT_SECRET: orbit-ci-test-secret-do-not-use-in-production

      - name: Run integration test (Orbit SDK)
        run: node tests/sdk-presence.test.mjs
        env:
          ORBIT_JWT_SECRET: orbit-ci-test-secret-do-not-use-in-production

      - name: Run integration test (REST publish API)
        run: node tests/rest-publish.test.mjs
        env:
          ORBIT_JWT_SECRET: orbit-ci-test-secret-do-not-use-in-production
          ORBIT_SERVER_SECRET: orbit-ci-server-secret-do-not-use-in-production

      - name: Run integration test (per-connection presence, cross-node)
        run: node tests/presence-multi-conn.test.mjs
        env:
          ORBIT_URL: http://localhost:8080
          ORBIT_URL_2: http://localhost:8081
          ORBIT_JWT_SECRET: orbit-ci-test-secret-do-not-use-in-production
          ORBIT_PRESENCE_LEAVE_GRACE_MS: 500
